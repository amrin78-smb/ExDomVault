[project]
name = "exdomainvault-worker"
version = "0.1.0"
description = "ExDomainVault home scanning worker (pull-based, outbound HTTPS only)"
requires-python = ">=3.12"

[project.scripts]
exdomainvault-worker = "app.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Only the application package; tests/ and deploy/ are not part of the distribution.
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
