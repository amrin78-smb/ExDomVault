name: Security

# Dependency advisories and secret scanning. Runs on every push and pull request, and weekly so
# advisories published after the last change are caught. See docs/operations.md ("Security checks").

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1' # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
      # npm audit reads package-lock.json; nothing is installed and no install scripts run.
      - name: Production dependencies (fail on high or critical)
        run: npm audit --omit=dev --audit-level=high
      - name: All dependencies incl. build and test tooling (fail on critical)
        run: npm audit --audit-level=critical
      - name: Full report (informational)
        if: always()
        run: npm audit || true

  pip-audit:
    name: pip-audit (worker)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install pinned audit tooling
        run: |
          python -m venv "$RUNNER_TEMP/audit"
          "$RUNNER_TEMP/audit/bin/pip" install --quiet -r worker/requirements-audit.txt
      # Fails on any known vulnerability in worker/requirements.txt or requirements-dev.txt, except
      # unexpired, documented entries in .github/audit/pip-audit-exceptions.txt.
      - name: Audit worker requirements
        run: bash scripts/audit-python.sh "$RUNNER_TEMP/audit/bin/pip-audit"

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # scan the whole history, not only the last commit
          persist-credentials: false
      # The CLI (not gitleaks-action) is used: no licence key or token needed, and the binary is
      # verified against a pinned SHA-256.
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan git history
        run: |
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --redact --no-banner --exit-code 1
