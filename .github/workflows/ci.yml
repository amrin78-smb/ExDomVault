name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app and API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # npm ci fails if package-lock.json does not satisfy package.json.
      - run: npm ci
      - name: Lockfile is complete and unchanged after install
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package-lock.json || {
            echo "::error file=package-lock.json::package-lock.json changed after install. Run 'npm install' locally and commit the lockfile."
            exit 1
          }
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Rules documentation is in sync with the registry
        run: npm run rules:docs:check
      - run: npm run build
      - name: Schema and migrations are in sync
        run: |
          npm run db:check
          npm run db:generate
          git add -N packages/database/migrations
          git diff --exit-code -- packages/database/migrations

  worker:
    name: Python worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm run worker:install
      - run: npm run worker:lint
      - run: npm run worker:test
