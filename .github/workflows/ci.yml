name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app and API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # npm ci fails if package-lock.json does not satisfy package.json.
      - run: npm ci
      - name: Lockfile is complete and unchanged after install
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package-lock.json || {
            echo "::error file=package-lock.json::package-lock.json changed after install. Run 'npm install' locally and commit the lockfile."
            exit 1
          }
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Rules documentation is in sync with the registry
        run: npm run rules:docs:check
      - run: npm run build
      - name: Schema and migrations are in sync
        run: |
          npm run db:check
          npm run db:generate
          git add -N packages/database/migrations
          git diff --exit-code -- packages/database/migrations

  worker:
    name: Python worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - run: npm run worker:install
      - run: npm run worker:lint
      - run: npm run worker:test
